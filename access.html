<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<title>Desbloquear Moon</title><link rel="stylesheet" href="./recovery.css"></head>
<body><main><h1>Perfil bloqueado</h1><p>Digite sua senha para abrir este perfil. Abas e dados ficam indisponíveis até o desbloqueio.</p>
<form id="unlock"><label for="password">Senha do perfil</label><input id="password" type="password" maxlength="1024" autocomplete="current-password" autofocus required><button id="submit" type="submit">Desbloquear</button></form>
<p id="status" role="status" aria-live="polite"></p><p>Esta proteção impede acesso casual pelo Moon. Ela não criptografa os arquivos do perfil e não substitui o bloqueio da sua conta no computador.</p>
</main><script src="./access.js"></script></body></html>
