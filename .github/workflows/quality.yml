name: Quality

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run native:electron
      - run: npm run test:electron-storage
      - run: xvfb-run -a npm run test:e2e
        if: runner.os == 'Linux'
      - run: npm run test:e2e
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-results-${{ matrix.os }}-${{ github.run_attempt }}
          path: test-results/**
          if-no-files-found: ignore
      - run: npm audit --audit-level=high
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm libarchive-tools
        if: runner.os == 'Linux'
      - run: npm run build:desktop
