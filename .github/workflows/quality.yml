name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run native:electron
      - run: npm run test:electron-storage
      - run: xvfb-run -a npm run test:e2e
      - run: npm audit --audit-level=high
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm libarchive-tools
      - run: npm run build:desktop
