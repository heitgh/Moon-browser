name: Desktop Releases

on:
  pull_request:
    paths:
      - .github/workflows/release-desktop.yml
      - electron-builder.yml
      - package.json
      - package-lock.json
      - scripts/build/**
      - apps/desktop/**
      - packages/**
      - ui/**
      - assets/**
      - index.html
      - main.js
      - preload.cjs
      - tsconfig*.json
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - .github/release-trigger
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v0.5.0-demo.2)"
        required: true
        default: "v0.5.0-demo.2"
        type: string
      publish_release:
        description: "Publicar os instaladores em GitHub Releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: moon-browser-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: moon-browser-linux-x64

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm libarchive-tools

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild native dependencies for Electron
        run: npm run native:electron

      - name: Build installers
        run: npm run build:desktop

      - name: Create Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File -Filter *.exe
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release/SHA256SUMS-windows.txt

      - name: Create Linux checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=( *.AppImage *.deb *.rpm *.pacman )
          if (( ${#files[@]} == 0 )); then
            echo "Nenhum pacote Linux foi gerado." >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS-linux.txt

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=v$(node -p "require('./package.json').version")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release and direct-download assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
            if [[ -f "$notes_file" ]]; then
              gh release edit "$RELEASE_TAG" --latest --notes-file "$notes_file" --repo "$GITHUB_REPOSITORY"
            else
              gh release edit "$RELEASE_TAG" --latest --repo "$GITHUB_REPOSITORY"
            fi
          else
            if [[ -f "$notes_file" ]]; then
              gh release create "$RELEASE_TAG" release/* \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Moon Browser $RELEASE_TAG" \
                --notes-file "$notes_file" \
                --latest
            else
              gh release create "$RELEASE_TAG" release/* \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Moon Browser $RELEASE_TAG" \
                --generate-notes \
                --latest
            fi
          fi
