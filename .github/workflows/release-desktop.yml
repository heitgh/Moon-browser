name: Desktop Releases

on:
  pull_request:
    paths:
      - .github/workflows/release-desktop.yml
      - electron-builder.yml
      - electron-builder.channel.cjs
      - electron-builder.release.cjs
      - package.json
      - package-lock.json
      - scripts/build/**
      - scripts/release/**
      - apps/desktop/**
      - packages/**
      - ui/**
      - assets/**
      - index.html
      - main.js
      - preload.cjs
      - tsconfig*.json
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v0.6.0-alpha.1)"
        required: true
        default: "v0.6.0-alpha.8"
        type: string
      publish_release:
        description: "Publicar os instaladores em GitHub Releases"
        required: true
        default: false
        type: boolean
      prepare_signed:
        description: "Gerar artefatos assinados para homologação, sem publicar"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: moon-browser-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: moon-browser-linux-x64

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate requested release tag
        if: github.event_name == 'workflow_dispatch' && (inputs.prepare_signed || inputs.publish_release)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: node -e 'const expected="v"+require("./package.json").version; if(process.env.INPUT_TAG!==expected) throw new Error("Release tag must be "+expected)'

      - name: Reject release outside main
        if: github.event_name == 'workflow_dispatch' && (inputs.prepare_signed || inputs.publish_release) && github.ref != 'refs/heads/main'
        run: node -e 'throw new Error("Signed releases must run from main")'

      - name: Check Windows signing prerequisites
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && (inputs.prepare_signed || inputs.publish_release) && github.ref == 'refs/heads/main'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          MOON_WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: node scripts/release/check-signing-prerequisites.mjs win32

      - name: Check Linux signing prerequisites
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && (inputs.prepare_signed || inputs.publish_release) && github.ref == 'refs/heads/main'
        env:
          LINUX_UPDATE_SIGNING_KEY_B64: ${{ secrets.LINUX_UPDATE_SIGNING_KEY_B64 }}
          LINUX_GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_B64 }}
          LINUX_GPG_FINGERPRINT: ${{ secrets.LINUX_GPG_FINGERPRINT }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: node scripts/release/check-signing-prerequisites.mjs linux

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm libarchive-tools

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild native dependencies for Electron
        run: npm run native:electron

      - name: Build unsigned test installers
        if: github.event_name != 'workflow_dispatch' || (!inputs.prepare_signed && !inputs.publish_release) || github.ref != 'refs/heads/main'
        env:
          MOON_RELEASE_SIGNED: "0"
        run: npm run build:desktop

      - name: Build signed Windows installers
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && (inputs.prepare_signed || inputs.publish_release) && github.ref == 'refs/heads/main'
        env:
          MOON_RELEASE_SIGNED: "1"
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          MOON_WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: npm run build:desktop

      - name: Build signed Linux installers
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && (inputs.prepare_signed || inputs.publish_release) && github.ref == 'refs/heads/main'
        env:
          MOON_RELEASE_SIGNED: "1"
          LINUX_UPDATE_SIGNING_KEY_B64: ${{ secrets.LINUX_UPDATE_SIGNING_KEY_B64 }}
        run: npm run build:desktop

      - name: Verify Electron fuses in unpacked application
        run: npm run verify:fuses

      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && (inputs.prepare_signed || inputs.publish_release) && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          MOON_WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          $installers = @(Get-ChildItem release -File -Filter *.exe)
          if ($installers.Count -ne 2) { throw "Expected setup and portable executables" }
          $appExecutables = @(Get-ChildItem 'release/win-unpacked' -File -Filter *.exe)
          if ($appExecutables.Count -ne 1) { throw "Expected one unpacked application executable" }
          $files = @($installers) + @($appExecutables)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
              throw "Invalid Authenticode signature on $($file.Name)"
            }
            if ($signature.SignerCertificate.Subject -ne $env:MOON_WINDOWS_PUBLISHER_NAME) {
              throw "Unexpected publisher on $($file.Name)"
            }
          }
          node -e 'const fs=require("node:fs"); const asar=require("@electron/asar"); const yaml=require("js-yaml"); const config=yaml.load(fs.readFileSync("release/win-unpacked/resources/app-update.yml","utf8")); if(config.publisherName!==process.env.MOON_WINDOWS_PUBLISHER_NAME) throw new Error("Updater publisher is not embedded"); if(asar.extractFile("release/win-unpacked/resources/app.asar","dist/types/security/moon-signed-windows-release").toString()!=="signed-release\n") throw new Error("Signed release marker is absent")'

      - name: Create Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File -Filter *.exe
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release/SHA256SUMS-windows.txt

      - name: Create Linux checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=( *.AppImage *.deb *.rpm *.pacman )
          if (( ${#files[@]} == 0 )); then
            echo "Nenhum pacote Linux foi gerado." >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS-linux.txt

      - name: Generate CycloneDX SBOM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm sbom --sbom-format cyclonedx --omit=dev > release/SBOM.cdx.json
          node -e 'const bom=require("./release/SBOM.cdx.json"); if(bom.bomFormat!=="CycloneDX" || !Array.isArray(bom.components) || !bom.components.length) process.exit(1)'

      - name: Sign and verify Linux release assets
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && (inputs.prepare_signed || inputs.publish_release) && github.ref == 'refs/heads/main'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_B64 }}
          LINUX_GPG_FINGERPRINT: ${{ secrets.LINUX_GPG_FINGERPRINT }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_UPDATE_SIGNING_KEY_B64: ${{ secrets.LINUX_UPDATE_SIGNING_KEY_B64 }}
        run: bash scripts/release/sign-linux.sh

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.yml
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.yml
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/SHA256SUMS-linux.txt
            release/SBOM.cdx.json
            release/*.asc
            release/*.sig
            release/moon-update-public.pem
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    environment: release-approval
    needs: [build, quality]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$tag" != "$expected" ]]; then
            echo "A tag precisa corresponder à versão compilada: $expected" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: moon-browser-*-x64
          path: release
          merge-multiple: true

      - name: Verify signed release assets
        env:
          LINUX_GPG_FINGERPRINT: ${{ secrets.LINUX_GPG_FINGERPRINT }}
        run: bash scripts/release/verify-assets.sh

      - name: Publish release and direct-download assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=( release/*.exe release/*.AppImage release/*.deb release/*.rpm release/*.pacman release/SHA256SUMS-*.txt release/SBOM.cdx.json release/moon-update-public.pem release/*.asc release/*.sig )
          if (( ${#assets[@]} != 19 )); then
            echo "Expected six installers, two checksums, SBOM, two public keys and eight signatures." >&2
            exit 1
          fi
          case "$RELEASE_TAG" in
            *-alpha.*) channel=alpha; prerelease=(--prerelease) ;;
            *-beta.*) channel=beta; prerelease=(--prerelease) ;;
            *) channel=latest; prerelease=() ;;
          esac
          metadata=( "release/signed-${channel}.yml" "release/signed-${channel}-linux.yml" )
          for manifest in "${metadata[@]}"; do
            if [[ ! -s "$manifest" ]]; then echo "Missing native update metadata: $manifest" >&2; exit 1; fi
          done
          assets+=( "${metadata[@]}" release/*.exe.blockmap )
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release já existe. Use uma nova versão; artefatos publicados são imutáveis." >&2
            exit 1
          else
            if [[ -f "$notes_file" ]]; then
              gh release create "$RELEASE_TAG" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Moon Browser $RELEASE_TAG" \
                --notes-file "$notes_file" \
                "${prerelease[@]}"
            else
              gh release create "$RELEASE_TAG" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Moon Browser $RELEASE_TAG" \
                --generate-notes \
                "${prerelease[@]}"
            fi
          fi
