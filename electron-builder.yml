appId: com.moon.browser
productName: Moon Browser
directories:
  output: release
files:
  - dist/types/**
  - ui/styles/**
  - assets/**
  - index.html
  - main.js
  - preload.cjs
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
linux:
  category: Network;WebBrowser
  syncDesktopName: true
  maintainer: Heitgh <207310826+heitgh@users.noreply.github.com>
  icon: assets/branding/moon-icon.svg
  artifactName: Moon-Browser-Linux-x64.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: pacman
      arch:
        - x64
win:
  icon: assets/branding/Moon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Moon-Browser-Windows-x64-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Moon Browser
  uninstallDisplayName: Moon Browser
portable:
  artifactName: Moon-Browser-Windows-x64-Portable.${ext}
mac:
  category: public.app-category.productivity
  target: dmg
